<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Workshop</title>
<style>html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:system-ui,Roboto,sans-serif}#boot{position:fixed;inset:0;display:grid;place-items:center}#boot i{width:84px;height:84px;border-radius:24px;background:#ee3a39;display:grid;place-items:center;font:300 48px/1 system-ui;font-style:normal;box-shadow:0 10px 40px rgba(238,58,57,.4)}</style></head>
<body><div id="boot"><i>+</i></div><div id="root"></div><div class="toast" id="toast" hidden></div>
<script>
/* Loader: runs the newest code it has (saved update or bundled copy), then checks GitHub for a newer one.
   Only the app code updates. Workshop data stays on this device. */
(function(){
  var BASE='https://raw.githubusercontent.com/Sulaiman9O/fsw-app/main/docs/garage/';
  function get(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
  function set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
  function txt(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text();});}
  function run(c){var b=document.getElementById('boot');if(b)b.remove();var st=document.createElement('style');st.textContent=c.css;document.head.appendChild(st);var sc=document.createElement('script');sc.textContent=c.js;document.body.appendChild(sc);}
  /* updates must be signed with our key (ECDSA P-256). Unsigned or changed code is refused. */
  var PUB='MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEQ8AOwQ/KnjhVbQh/Sw7r0NFGqGXW+gaQT3GoQ+LpgesWv3qDYVvgU01avPAMfSJWfXxTX0mNU/aqxMbthVcMUQ==';
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function verify(v,css,js,sig){var S=window.crypto&&crypto.subtle;if(!S)return Promise.resolve(false);
    return S.importKey('spki',b64(PUB),{name:'ECDSA',namedCurve:'P-256'},false,['verify']).then(function(k){return S.verify({name:'ECDSA',hash:'SHA-256'},k,b64(sig),new TextEncoder().encode(v+'\n'+css+'\n'+js));}).catch(function(){return false;});}
  function check(cur){txt(BASE+'version.json?t='+Date.now()).then(function(t){var rv=JSON.parse(t);if(!(rv.v>cur.v))return;
    return Promise.all([txt(BASE+'app.css?v='+rv.v),txt(BASE+'app.js?v='+rv.v),txt(BASE+'sig.json?v='+rv.v)]).then(function(p){var sg=JSON.parse(p[2]);if(sg.v!==rv.v)return;
      return verify(rv.v,p[0],p[1],sg.sig).then(function(ok){if(!ok){console.warn('update refused: bad signature');return;}if(set('ws_code',{v:rv.v,name:rv.name,css:p[0],js:p[1]}))window.dispatchEvent(new CustomEvent('ws-update',{detail:rv}));});});}).catch(function(){});}
  var saved=get('ws_code');
  txt('app/version.json').then(function(t){return JSON.parse(t);}).catch(function(){return {v:0};}).then(function(bv){
    if(saved&&saved.v>=bv.v){run(saved);check(saved);setTimeout(function(){var r=document.getElementById('root');if(r&&!r.children.length){try{localStorage.removeItem('ws_code');}catch(e){}location.reload();}},4000);return;}
    return Promise.all([txt('app/app.css'),txt('app/app.js')]).then(function(p){var c={v:bv.v,name:bv.name,css:p[0],js:p[1]};run(c);check(c);});
  }).catch(function(){document.body.innerHTML='<p style="padding:30px;text-align:center">The app could not start. Close it and open it again.</p>';});
})();
</script></body></html>
