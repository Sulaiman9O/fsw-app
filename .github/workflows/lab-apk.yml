name: Build FSW Lab APK (test app)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lab/**'
      - '.github/workflows/lab-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Latest prices into the bundle
        run: cp ../docs/data/prices.json www/data/prices.json
      - name: Android project
        run: npx cap add android
      - name: Print plugin + camera permission
        run: |
          cp native/FswPrintPlugin.java native/MainActivity.java android/app/src/main/java/om/fsw/lab/
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Icons
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#000000' --splashBackgroundColor '#000000'
      - name: Version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"0.1.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build
        run: npx cap sync android && cd android && ./gradlew assembleRelease --no-daemon
      - name: Sign
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ../keystore/fsw.keystore --ks-key-alias fsw --ks-pass pass:fswapp2026 --key-pass pass:fswapp2026 --out fsw-lab.apk aligned.apk
          $BT/apksigner verify fsw-lab.apk
      - name: Release (does not touch the main app's latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab
          name: FSW Lab (test app)
          make_latest: false
          prerelease: true
          files: lab/fsw-lab.apk
