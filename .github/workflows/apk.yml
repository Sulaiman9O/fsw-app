name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'capacitor.config.json'
      - 'package.json'
      - 'assets/**'
      - 'native/**'
      - '.github/workflows/apk.yml'
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Web files (app shell + bundled offline copy)
        run: mkdir -p www && cp -r docs/* www/
      - name: Android project
        run: npx cap add android
      - name: Native plugins (print, OCR) + camera permission
        run: |
          cp native/FswPrintPlugin.java native/FswOcrPlugin.java native/MainActivity.java android/app/src/main/java/om/fsw/workshop/
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "com.google.mlkit:text-recognition:16.0.1"\n    implementation "cz.adaptech.tesseract4android:tesseract4android:4.9.0"/' android/app/build.gradle
          grep -n "mlkit\|tesseract" android/app/build.gradle
          # Tesseract4Android lives on JitPack
          if grep -q "dependencyResolutionManagement" android/settings.gradle; then sed -i '0,/repositories {/s//repositories {\n        maven { url "https:\/\/jitpack.io" }/' android/settings.gradle; else sed -i '0,/allprojects {\n    repositories {/s//&/' android/build.gradle; sed -i '/allprojects {/,/}/ s/repositories {/repositories {\n        maven { url "https:\/\/jitpack.io" }/' android/build.gradle; fi
          grep -n "jitpack" android/settings.gradle android/build.gradle || true
          sed -i '0,/^android {/s//android {\n    packagingOptions { jniLibs { pickFirsts += ["**\/libc++_shared.so"] } }/' android/app/build.gradle
          mkdir -p android/app/src/main/assets/tessdata
          curl -sSL -o android/app/src/main/assets/tessdata/ara.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/ara.traineddata
          ls -la android/app/src/main/assets/tessdata
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Icons
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#000000' --splashBackgroundColor '#000000'
      - name: Version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleRelease --no-daemon > ../build.log 2>&1 || { tail -c 6000 ../build.log > ../err.txt; echo BUILD_FAILED > ../failed; }
          tail -5 ../build.log
      - name: Report build error as an issue (so it can be read from anywhere)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -f failed ]; then printf '```\n%s\n```' "$(grep -v '^$' err.txt | grep -i -B2 -A12 'error\|FAILED\|What went wrong' | head -120)" > body.md; gh issue create --title "Build failed: run ${{ github.run_number }}" --body-file body.md; exit 1; fi
      - name: Sign
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks keystore/fsw.keystore --ks-key-alias fsw --ks-pass pass:fswapp2026 --key-pass pass:fswapp2026 --out fsw.apk aligned.apk
          $BT/apksigner verify fsw.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: FSW 1.0.${{ github.run_number }}
          make_latest: true
          files: fsw.apk
