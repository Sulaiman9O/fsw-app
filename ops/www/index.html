:root{
  --black:#000; --ink:#0b0b0c; --bg:#0b0b0c; --panel:#141416; --panel2:#1c1c1f; --line:#2a2a2e; --line2:#1d1d20;
  --red:#ee3a39; --red2:#ff8a7a; --orange:#f27b21; --white:#fff; --text:#e9e9ec; --muted:#9a9aa1; --dim:#6d6d74;
  --ok:#3ccf7d; --warn:#f0a25e; --bad:#ff6b6a;
  --v016:#0f8f8a; --v020:#2e9d3a; --v530:#2563c9; --v540:#5a45c4; --v1040:#c98a00; --v2050:#c2410c; --v1540:#7a5230; --vx:#6b7280;
  --f-brand:"FSW Millburn","Arial Black",Impact,sans-serif;
  --f-body:"FSW Rubik",system-ui,-apple-system,Roboto,sans-serif;
  --rail:0px; --navh:68px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);min-height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font:16px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent}
#boot{display:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
.num{font-family:var(--f-brand);font-weight:400;letter-spacing:.01em;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{min-height:100%}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 10px;background:rgba(11,11,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line2)}
.top .em{height:30px}
.top .t{font:400 1rem var(--f-brand)}
.top .me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.7rem;color:var(--muted);text-align:right;line-height:1.15}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 .85rem var(--f-body);color:#fff;background:#232327;border:2px solid #34343a;flex:0 0 auto}
.av.me{background:var(--red);border-color:var(--red2)}
main{padding:14px 16px calc(var(--navh) + 110px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start;max-width:1400px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:12;background:#0b0b0c;border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .in{display:grid;grid-template-columns:repeat(4,1fr)}
.navb{min-height:var(--navh);display:grid;justify-items:center;align-content:center;gap:3px;font-size:.66rem;font-weight:600;color:var(--dim);position:relative}
.navb svg{width:24px;height:24px}
.navb[aria-current="page"]{color:var(--red)}
.navb[aria-current="page"] svg{filter:drop-shadow(0 0 6px rgba(238,58,57,.6))}
.soon{position:absolute;top:6px;right:18%;font-size:.55rem;background:#232327;color:var(--muted);border-radius:4px;padding:0 4px}
nav.rail{display:none}

.lbl{display:flex;align-items:center;gap:8px;font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600;margin:0}
.lbl b{width:22px;height:22px;border-radius:7px;background:var(--red);color:#fff;display:grid;place-items:center;font:400 .7rem var(--f-brand);letter-spacing:0}
.crumbs{display:flex;gap:8px;flex-wrap:wrap}
.crumb{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.88rem;min-height:40px;display:flex;align-items:center;gap:8px}
.crumb span{color:var(--red)}

/* ---------- pick screens ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.mk{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-height:88px;padding:8px;display:grid;place-items:center;align-content:center;gap:4px;font-weight:600;font-size:.88rem;text-align:center}
.mk:active,.md:active,.yr:active{transform:scale(.97)}
.mk .mono{font:400 1.35rem var(--f-brand);color:#fff}
.badge{width:52px;height:52px;border-radius:14px;background:#fff;display:grid;place-items:center;padding:5px;box-shadow:0 4px 14px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.06)}
.badge img{width:100%;height:100%;object-fit:contain;border-radius:9px}
.badge.sm{width:36px;height:36px;border-radius:10px;padding:3px}
.mk .cnt{font-size:.66rem;color:var(--muted);font-weight:400}
.mk.hot{border-color:#3a2a2a;background:linear-gradient(160deg,rgba(238,58,57,.2),var(--panel) 60%)}
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.md{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(90% 55% at 50% 100%,rgba(242,123,33,.3),transparent 70%),linear-gradient(180deg,#121214,#050506);display:grid;text-align:left}
.md .pic{height:100px;display:grid;place-items:center;padding-top:8px}
.md .pic svg{width:100%;height:96px}
.md .pic img{width:100%;height:100px}
.pic img.cut{object-fit:contain;padding:4px 10px 0;filter:drop-shadow(0 10px 10px rgba(0,0,0,.7))}
.pic img.photo{object-fit:cover;-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent);mask-image:linear-gradient(180deg,#000 70%,transparent)}
.md .pic:has(img.photo){padding-top:0}
.md .nm{padding:6px 12px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.md .nm b{font:400 .92rem var(--f-brand);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md .nm span{font-size:.68rem;color:var(--muted)}
.cam{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;cursor:pointer;color:rgba(255,255,255,.75)}
.cam svg{width:14px;height:14px}
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.yr{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:56px;display:grid;place-items:center;font:400 1.15rem var(--f-brand);position:relative}
.yr.hist::after{content:"";position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
.yr.wide{grid-column:1/-1;font:600 1rem var(--f-body)}
.engs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.eng{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-height:80px;padding:12px;display:grid;gap:4px;text-align:left;font-weight:600}
.eng small{color:var(--muted);font-weight:400}
.hint{margin:0;color:var(--muted);font-size:.82rem}

/* ---------- price screen ---------- */
.q{display:grid;gap:14px}
.q-main{display:grid;gap:12px;align-content:start;min-width:0}
.hero{border-radius:20px;border:1px solid var(--line);background:radial-gradient(70% 80% at 30% 115%,rgba(238,58,57,.45),transparent 70%),linear-gradient(180deg,#141416,#050506);display:flex;align-items:center;gap:12px;padding:10px 14px;overflow:hidden}
.hero .pic{width:130px;height:78px;flex:0 0 auto;display:grid;place-items:center}
.hero .pic svg{width:100%;height:100%}
.hero .pic img{width:100%;height:100%}
.hero .pic img.photo{border-radius:10px}
.hero b{display:block;font:400 1.15rem var(--f-brand)}
.hero span{color:var(--muted);font-size:.8rem}
.visc{display:flex;gap:7px;flex-wrap:wrap}
.vc{border:1.5px solid var(--vc);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.86rem;display:flex;align-items:center;gap:6px;color:var(--text);min-height:38px}
.vc::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--vc)}
.vc.sel{background:var(--vc);color:#fff}
.vc.sel::before{background:#fff}
.note{font-size:.84rem;color:var(--warn);background:rgba(240,162,94,.1);border:1px solid rgba(240,162,94,.25);border-radius:12px;padding:9px 12px}
.oils{display:grid;gap:10px}
.oil{position:relative;border-radius:16px;border:1px solid var(--line);background:var(--panel);padding:12px 12px 12px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;width:100%}
.oil::before{content:"";position:absolute;left:7px;top:11px;bottom:11px;width:4px;border-radius:2px;background:var(--vc)}
.oil.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset,0 8px 22px rgba(238,58,57,.18)}
.oil .nm{font-weight:600;font-size:.98rem;min-width:0}
.oil .tot{font:400 1.45rem var(--f-brand);text-align:right;line-height:1}
.oil .tot small{display:block;font:500 .6rem var(--f-body);color:var(--muted);letter-spacing:.1em;margin-top:3px}
.oil .brk{grid-column:1/-1;font-size:.76rem;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap}
.oil .brk b{color:var(--text);font-weight:600}
.check{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;display:none;place-items:center;font-size:.8rem;font-weight:700;box-shadow:0 0 10px rgba(238,58,57,.6)}
.oil.sel .check{display:grid}
.tags{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.tag{font-size:.64rem;font-weight:600;border-radius:5px;padding:2px 7px}
.t-red{background:rgba(238,58,57,.18);color:#ff7a70}.t-ok{background:rgba(60,207,125,.14);color:var(--ok)}.t-mute{background:#232327;color:var(--muted)}.t-warn{background:rgba(240,162,94,.15);color:var(--warn)}.t-bad{background:rgba(255,107,106,.15);color:var(--bad)}

.q-side{display:grid;gap:12px;align-content:start}
.job{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:4px 14px}
.jr{display:flex;align-items:center;gap:10px;min-height:58px;border-bottom:1px solid #222226;padding:6px 0}
.jr:last-child{border-bottom:0}
.jr .k{flex:1;min-width:0;font-weight:600}
.jr .k small{display:block;color:var(--muted);font-weight:400;font-size:.74rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jr .v{font:400 1.1rem var(--f-brand)}
.jr .ctl{display:flex;align-items:center;gap:8px}
.cat{display:inline-flex;align-items:center;margin-top:4px;margin-right:6px;border:1px solid rgba(242,123,33,.5);color:var(--orange);background:rgba(242,123,33,.1);border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:600;text-transform:none;letter-spacing:0}
.stp{display:flex;align-items:center;gap:4px;background:var(--panel2);border-radius:12px;padding:4px}
.stp button{width:36px;height:36px;border-radius:9px;background:#26262a;font-weight:700;font-size:1.1rem}
.stp .v{min-width:44px;text-align:center}
.seg{display:flex;background:var(--panel2);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:9px;font-size:.84rem;font-weight:600;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:#fff;color:#000}
.sw{width:50px;height:30px;border-radius:999px;background:#2b2b30;position:relative;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{left:24px}
.svc{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600;width:100%;text-align:left;min-height:56px}
.svc svg{width:22px;height:22px;flex:0 0 auto}
.svc .v{margin-left:auto;font:400 1rem var(--f-brand);color:var(--orange)}
.svc.sel{border-color:var(--ok);background:linear-gradient(90deg,rgba(60,207,125,.14),var(--panel))}
.svc.sel .v{color:var(--ok)}
.disc{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:12px 14px;display:grid;gap:10px}
.disc .row{display:flex;gap:8px;flex-wrap:wrap}
.disc .row button{border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 12px;font:400 .95rem var(--f-brand)}
.disc .row button[aria-pressed="true"]{border-color:var(--red);background:rgba(238,58,57,.15);color:#ff7a70}
.total{position:fixed;left:12px;right:12px;bottom:calc(var(--navh) + 8px + env(safe-area-inset-bottom,0px));z-index:11;background:linear-gradient(90deg,#1a1a1d,#141416);border:1px solid var(--line);border-radius:18px;padding:9px 9px 9px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.total .l{font-size:.6rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.total .big{font:400 1.5rem var(--f-brand);line-height:1}
.total .big small{font:500 .65rem var(--f-body);color:var(--muted);margin-left:4px}
.send{margin-left:auto;background:var(--red);color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;font-size:.92rem;display:flex;align-items:center;gap:7px;box-shadow:0 6px 16px rgba(238,58,57,.35);min-height:44px}
.send svg{width:17px;height:17px}

/* ---------- other screens ---------- */
.card{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:4px 14px}
.card .jr .ic{width:40px;height:40px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;flex:0 0 auto}
.card .jr .ic svg{width:22px;height:22px}
.small-btn{border:1px dashed #3a3a40;border-radius:12px;min-height:42px;padding:0 14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.btn{border-radius:14px;background:var(--red);color:#fff;font-weight:600;min-height:52px;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.ghost{background:var(--panel2);border:1px solid var(--line)}
.btn svg{width:20px;height:20px}
.empty{text-align:center;color:var(--muted);padding:30px 12px;display:grid;gap:10px;justify-items:center}
.empty svg{width:44px;height:44px;opacity:.5}
.hist{display:grid;gap:10px}
.hi{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.hi b{font-weight:600}.hi span{color:var(--muted);font-size:.82rem}
.hi .tot{grid-row:1/4;grid-column:2;align-self:center;font:400 1.3rem var(--f-brand)}
.field{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#111113;color:#fff}

/* sheets, toast, update bar */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet .pnl{background:#121214;border:1px solid var(--line);width:100%;max-width:640px;border-radius:22px 22px 0 0;max-height:84vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.sheet h3{margin:0;font:400 1.1rem var(--f-brand)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:58px}
.opt.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.opt .tx{flex:1;min-width:0}.opt .tx b{display:block;font-weight:600}.opt .tx span{font-size:.8rem;color:var(--muted)}
.opt .v{font:400 1rem var(--f-brand)}
pre.msg{white-space:pre-wrap;direction:rtl;text-align:right;font:15px/1.6 system-ui,Tahoma,sans-serif;background:#0b0b0c;border:1px solid var(--line);border-radius:14px;padding:14px;margin:0;max-height:40vh;overflow:auto;color:var(--text)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--navh) + 90px + env(safe-area-inset-bottom,0px));margin:auto;max-width:360px;background:#fff;color:#000;border-radius:12px;padding:12px 16px;text-align:center;font-weight:600;z-index:40}
.upd{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:40;max-width:520px;margin:auto;background:#123d26;border:1px solid var(--ok);color:#fff;border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:10px;font-weight:600}
.upd button{margin-left:auto;border-radius:10px;background:#fff;color:#000;font-weight:600;padding:9px 14px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(120% 55% at 50% 12%,rgba(238,58,57,.38),rgba(242,123,33,.07) 45%,transparent 70%),var(--black)}
.login .in{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:18px}
.login .logo{width:min(290px,80vw);filter:drop-shadow(0 6px 24px rgba(238,58,57,.35))}
.login h2{margin:0;font:600 1.1rem var(--f-body);color:var(--text);text-align:center}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;width:100%}
.person{border:1px solid var(--line);background:linear-gradient(180deg,#19191c,#0f0f11);border-radius:18px;padding:12px 4px 10px;display:grid;justify-items:center;gap:6px;font-weight:600;font-size:.9rem}
.person small{color:var(--muted);font-weight:400;font-size:.7rem}
.person .av{width:50px;height:50px;font-size:1rem}
.person.sel{border-color:var(--red);background:linear-gradient(180deg,rgba(238,58,57,.25),#121214 70%);box-shadow:0 0 0 1px var(--red) inset,0 10px 26px rgba(238,58,57,.25)}
.person.sel .av{background:var(--red);border-color:var(--red2)}
.dots{display:flex;gap:16px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid #4a4a52;display:block}
.dots i.on{background:var(--red);border-color:var(--red);box-shadow:0 0 12px rgba(238,58,57,.8)}
.pad{display:grid;grid-template-columns:repeat(3,68px);gap:14px 26px;justify-content:center}
.pad button,.pad span{width:68px;height:68px}
.key{border-radius:50%;display:grid;place-items:center;font:500 1.55rem var(--f-body);color:#fff;position:relative;background:radial-gradient(circle at 50% 30%,#2a2a2f 0%,#151518 65%,#0d0d0f 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 6px rgba(0,0,0,.6),0 6px 14px rgba(0,0,0,.55)}
.key::before{content:"";position:absolute;inset:-1px;border-radius:50%;padding:1px;background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.03) 45%,rgba(238,58,57,.45));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.key:active{background:radial-gradient(circle at 50% 30%,#ff5a4f,#ee3a39 60%,#b8211f);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 22px rgba(238,58,57,.6)}
.key.ghost{background:none;box-shadow:none;color:var(--muted);font-size:1.25rem}
.key.ghost::before{display:none}
.err{color:#ff8a8a;min-height:1.3em;font-weight:600;text-align:center}
.login p{margin:0;color:var(--muted);text-align:center}

/* ---------- tablet ---------- */
@media (min-width:760px){
  :root{--rail:88px;--navh:0px}
  nav.bottom{display:none}
  nav.rail{display:flex;position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:12;flex-direction:column;align-items:center;gap:20px;padding:calc(env(safe-area-inset-top,0px) + 16px) 0 18px;background:#0b0b0c;border-right:1px solid var(--line2)}
  nav.rail .em{width:58px}
  nav.rail .navb{min-height:64px;width:100%;font-size:.7rem}
  nav.rail .navb svg{width:26px;height:26px}
  nav.rail .soon{right:14px;top:2px}
  nav.rail .av{margin-top:auto;width:42px;height:42px}
  .shell{padding-left:var(--rail)}
  .top{display:none}
  main{padding:20px 22px 40px;gap:16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .mk{min-height:104px}
  .mk .badge{width:60px;height:60px}
  .models{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .md .pic{height:120px}.md .pic svg{height:116px}.md .pic img{height:120px}
  .years{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
  .oils{grid-template-columns:1fr 1fr}
  .hero .pic{width:200px;height:118px}
  .hero b{font-size:1.55rem}
  .hero span{font-size:.9rem}
  .toast{bottom:40px}
  /* portrait tablet: fixed dock at the bottom */
  main.has-dock{padding-bottom:240px}
  .q-side{position:fixed;left:var(--rail);right:0;bottom:0;z-index:11;background:linear-gradient(180deg,#101012,#0b0b0c);border-top:1px solid var(--line2);padding:14px 22px calc(16px + env(safe-area-inset-bottom,0px));grid-template-columns:repeat(4,1fr);gap:10px}
  .q-side .job{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border:0;background:none;padding:0}
  .q-side .jr{flex-direction:column;align-items:stretch;gap:6px;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:8px 10px;min-height:0}
  .q-side .jr .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
  .q-side .jr .k small{text-transform:none;letter-spacing:0;color:var(--text);font-size:.8rem;font-weight:600}
  .q-side .jr .ctl{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .q-side .svc{grid-column:span 1;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;font-size:.85rem;padding:10px 12px}
  .q-side .svc .v{margin-left:0}
  .q-side .disc{grid-column:span 2;padding:10px 12px;gap:8px}
  .q-side .disc .row{gap:6px}
  .q-side .disc .row button{min-height:34px;padding:0 9px;font-size:.85rem}
  .q-side .total{position:static;grid-column:span 1;box-shadow:none;margin:0;flex-direction:column;align-items:stretch;gap:8px;padding:10px 12px}
  .q-side .total .send{margin:0;justify-content:center}
  .q-side .svc,.q-side .disc{min-height:0}
  .q-side.no-disc .svc{grid-column:span 2;flex-direction:row;align-items:center}
  .q-side.no-disc .svc .v{margin-left:auto}
  .q-side.no-disc .total{grid-column:span 2;flex-direction:row;align-items:center}
  .q-side.no-disc .total .send{margin-left:auto}
}
/* landscape tablet: right panel */
@media (min-width:1000px) and (orientation:landscape){
  .q{grid-template-columns:1fr 360px;align-items:start}
  main.has-dock{padding-bottom:40px}
  .q-side{position:sticky;top:20px;left:auto;right:auto;bottom:auto;z-index:1;background:none;border:0;padding:0;grid-template-columns:1fr;max-height:calc(100vh - 40px);overflow:auto}
  .q-side .job{display:block;border:1px solid var(--line);background:var(--panel);padding:4px 14px;border-radius:18px}
  .q-side .jr{flex-direction:row;align-items:center;border:0;border-bottom:1px solid #222226;border-radius:0;background:none;padding:6px 0;min-height:58px}
  .q-side .jr .k{font-size:1rem;text-transform:none;letter-spacing:0;color:var(--white)}
  .q-side .jr .k small{color:var(--muted);font-weight:400;font-size:.74rem}
  .q-side .svc,.q-side .disc,.q-side .total{grid-column:auto}
  .q-side .total{flex-direction:column;align-items:stretch;padding:16px;background:radial-gradient(90% 120% at 100% 0,rgba(238,58,57,.35),transparent 60%),#141416}
  .q-side .total .big{font-size:2.4rem}
  .q-side .total .send{margin:0;justify-content:center;padding:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- New home (test) ---- */
.nh-hello{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.nh-hello b{font:400 1.2rem var(--f-brand)}
.nh-hello span{font-size:.78rem;color:var(--muted)}
.nh-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.nh-tile{position:relative;border:1px solid var(--line);border-radius:18px;background:var(--panel);min-height:118px;padding:14px;display:grid;align-content:space-between;text-align:left;gap:8px;overflow:hidden;width:100%}
.nh-tile::after{content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--glow,rgba(238,58,57,.22)),transparent 70%);pointer-events:none}
.nh-tile .ic{width:42px;height:42px;border-radius:12px;background:var(--tc,#26262a);display:grid;place-items:center;font-size:1.3rem;position:relative;z-index:1}
.nh-tile b{display:block;font:400 1.08rem var(--f-brand);position:relative;z-index:1}
.nh-tile span{font-size:.76rem;color:var(--muted);position:relative;z-index:1}
.nh-tile .n{position:absolute;top:12px;right:14px;font:400 1.5rem var(--f-brand);color:#fff;z-index:1}
.nh-tile.wide{grid-template-columns:auto 1fr auto;align-items:center;min-height:86px;background:linear-gradient(120deg,rgba(238,58,57,.22),var(--panel) 60%);border-color:#3a2a2a}
.nh-tile.wide .n{position:static}
.nh-head{display:flex;align-items:center;gap:10px}
.nh-bk{width:40px;height:40px;border-radius:12px;background:var(--panel2);font-weight:700;font-size:1.3rem}
.nh-head b{font:400 1.2rem var(--f-brand)}
.nh-list{display:grid;gap:8px}
.nh-row{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:3px 10px}
.nh-row b{font-weight:600;font-size:.92rem;min-width:0}
.nh-row .m{font-size:.74rem;color:var(--muted);grid-column:1}
.nh-row .r{grid-row:1/3;grid-column:2;align-self:center;text-align:right;font:400 1.1rem var(--f-brand)}
.nh-row .r small{display:block;font:600 .62rem var(--f-body)}
.nh-bar{grid-column:1/-1;height:6px;border-radius:3px;background:#26262a;overflow:hidden;margin-top:4px}
.nh-bar i{display:block;height:100%;border-radius:3px}
@media (min-width:760px){.nh-tiles{grid-template-columns:repeat(3,1fr)}.nh-tile{min-height:140px}.nh-list{grid-template-columns:1fr 1fr}}

.send.job{margin-left:auto;background:#1f8f4e;box-shadow:0 6px 16px rgba(31,143,78,.35)}.send.job+.send{margin-left:0}
.btn.okb{background:#1f8f4e}

const AR={'Ops room':'غرفة العمليات','Today':'اليوم','Reminders':'التذكيرات','Stock':'المخزون','Orders':'الطلبيات','Money':'الفلوس','Performance':'الأداء','Count':'الجرد','AI':'المساعد',

'Demo data · nothing is saved to the system':'بيانات تجريبية · ما ينحفظ شي في النظام','Updated':'آخر تحديث',
"Today's tasks":'مهام اليوم','Open':'المفتوحة','All':'الكل','Data':'بيانات','General':'عام','Customers':'زباين','Urgent':'عاجل','This week':'هذا الأسبوع','When free':'متى ما تيسر','Done':'تم','done by':'تم بواسطة','from AI review':'من مراجعة المساعد','Add a task for the team…':'أضف مهمة للفريق…','Add':'إضافة','Nothing here.':'ما فيه شي هنا.','Added (demo)':'انضافت (تجريبي)',
'Engine oil reminders':'تذكيرات زيت المحرك','30 days late → next 7 days':'متأخر 30 يوم ← الأسبوع الجاي','Not sent':'لم تُرسل','Sent':'أُرسلت','Needs a check':'تحتاج تأكيد','engine oil':'زيت محرك','Mark sent':'تم الإرسال','Undo':'تراجع','All reminders sent.':'كل التذكيرات أُرسلت.','Check in the system: did he come back?':'تأكد من النظام: هل رجع؟','Demo: message copied.':'تجريبي: الرسالة انسخت.',
'Stock by burn rate':'المخزون حسب سرعة الاستهلاك','red = under 14 days':'أحمر = أقل من 14 يوم','lasts':'يكفي','days':'يوم','Order':'اطلب','/wk':'/أسبوع',
'Suggested orders':'طلبيات مقترحة','cheapest supplier':'المورد الأرخص','items':'أصناف','each':'للواحد','Order total (cost)':'مجموع الطلبية (تكلفة)','Copy message':'نسخ الرسالة','Mark ordered':'تم الطلب','Ordered':'تم الطلب','Order message copied':'رسالة الطلب انسخت',
'Open invoices':'الفواتير المفتوحة','older than 30 days':'أقدم من 30 يوم','Who owes the most':'أكبر المديونيات','of what is due':'من المستحق',
'Sales & profit · 12 weeks':'المبيعات والربح · 12 أسبوع','Sales':'المبيعات','Profit':'الربح','This week, day by day':'هذا الأسبوع يوم بيوم','Day':'اليوم','Invoices':'فواتير','Top services this week':'أكثر الخدمات هذا الأسبوع','jobs':'جوب',
'Daily count':'الجرد اليومي','Count the shelf first, then type the number. The system figure shows after you save.':'عدّ القطعة على الرف أول، بعدين اكتب الرقم. رقم النظام يطلع بعد الحفظ.','How many on the shelf?':'كم على الرف؟','Save':'حفظ','Counted':'العدد','system: — (with live data)':'النظام: — (مع البيانات الحية)','Reset today (demo)':'امسح جرد اليوم (تجريبي)',
'Ask the workshop AI':'اسأل مساعد الورشة','demo answers':'ردود تجريبية','Top 3 things today':'أهم 3 أشياء اليوم','Who owes the most?':'منو عليه أكثر فلوس؟','Order message for Mannol':'رسالة طلب لمانول',"Ask about today's data…":'اسأل عن بيانات اليوم…','Ask':'اسأل','The real version answers from the night report. It needs an AI key (small cost per question).':'النسخة الحقيقية تجاوب من تقرير الليل. تحتاج مفتاح AI (تكلفة بسيطة لكل سؤال).',
'Sat':'السبت','Sun':'الأحد','Mon':'الاثنين','Tue':'الثلاثاء','Wed':'الأربعاء','Thu':'الخميس','Fri':'الجمعة'};
let LANG=store.get('opslang','en');
const T=k=>LANG==='ar'&&AR[k]!=null?AR[k]:k;
const ar=t=>`<bdi dir="auto">${t}</bdi>`;
const due=d=>LANG==='ar'?(d<0?`فات موعده ${-d===1?'يوم':-d===2?'يومين':(-d)+' يوم'}`:d===0?'موعده اليوم':`بعد ${d===1?'يوم':d===2?'يومين':d+' يوم'}`):(d<0?`due ${-d} day${-d>1?'s':''} ago`:d===0?'due today':`due in ${d} day${d>1?'s':''}`);
const age=a=>LANG==='ar'?(a===1?'من يوم':a===2?'من يومين':'من '+a+' أيام'):a+' day'+(a>1?'s':'')+' old';
const dn=()=>store.get('opsdone',{}),sent=()=>store.get('opssent',{}),cnt=()=>store.get('opscount',{}),ord=()=>store.get('opsord',{});
const O={tab:store.get('opstab','today'),f:'open',rf:'todo'};
const TABS=[['today','Today'],['rem','Reminders'],['stock','Stock'],['orders','Orders'],['money','Money'],['perf','Performance'],['count','Count'],['ai','AI']];

function renderOps(m,hd){
  const d=dn();const openTasks=D.tasks.filter(t=>!(d[t.id]??t.done)).length;
  const remTodo=D.reminders.filter(r=>r.kind!=='flag'&&!sent()[r.key]).length;
  const toOrder=D.stock.filter(s=>s.days<=14).length;
  const up=new Date(D.meta.updatedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const cnts={today:openTasks,rem:remTodo,stock:toOrder,money:D.money.open.length,count:D.count.length};
  m.innerHTML=`<div class="ops">
  <div class="ops-hd"><button class="nh-bk" data-home aria-label="Home">‹</button><div class="ttl"><b>${ar(T('Ops room'))}</b><span>${ar(T('Updated'))} ${up} · <em>${ar(T('Demo data · nothing is saved to the system'))}</em></span></div><button class="lang" data-lang>${LANG==='ar'?'EN':'عربي'}</button></div>
  <div class="ops-kpis">
    <div class="kpi"><b>${f3(D.kpi.week.revenue)}</b><span>${ar(T('Sales this week'))} · OMR</span><em>▲ ${Math.round(D.kpi.week.delta*100)}% ${ar(T('vs last week'))}</em></div>
    <div class="kpi ok"><b>${f3(D.kpi.week.profit)}</b><span>${ar(T('Profit this week'))} · OMR</span></div>
    <div class="kpi org" data-go="money"><b>${f3(D.money.due)}</b><span>${ar(T('Due from customers'))}</span></div>
    <div class="kpi red" data-go="stock"><b>${toOrder}</b><span>${ar(T('Parts to order'))}</span></div>
    <div class="kpi" data-go="rem"><b>${remTodo}</b><span>${ar(T('To remind'))}</span></div>
    <div class="kpi" data-go="today"><b>${openTasks}</b><span>${ar(T('Open tasks'))}</span></div>
  </div>
  <div class="ops-tabs">${TABS.map(([k,l])=>`<button data-otab="${k}" aria-pressed="${O.tab===k}">${ar(T(l))}${cnts[k]?`<span>${cnts[k]}</span>`:''}</button>`).join('')}</div>
  <div class="ops-panel" id="opsPanel"></div></div>`;
  m.querySelector('[data-home]').onclick=()=>{S.sec=null;render();scrollTo(0,0);};
  m.querySelector('[data-lang]').onclick=()=>{LANG=LANG==='ar'?'en':'ar';store.set('opslang',LANG);render();};
  m.querySelectorAll('[data-otab]').forEach(b=>b.onclick=()=>{O.tab=b.dataset.otab;store.set('opstab',O.tab);render();});
  m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{O.tab=b.dataset.go;store.set('opstab',O.tab);render();});
  ({today:pToday,rem:pRem,stock:pStock,orders:pOrders,money:pMoney,perf:pPerf,count:pCount,ai:pAI})[O.tab]($('#opsPanel'));
}
const sec=(t,r='')=>`<div class="ops-sec"><b>${ar(t)}</b><span>${r}</span></div>`;
const chips=(list,cur,attr)=>`<div class="ops-chips">${list.map(([k,l])=>`<button data-${attr}="${k}" aria-pressed="${cur===k}">${ar(T(l))}</button>`).join('')}</div>`;
const PRI={high:['var(--red)','t-red','Urgent'],med:['var(--warn)','t-warn','This week'],low:['#5a45c4','t-mute','When free']};
const AREA={stock:'Stock',money:'Money',customers:'Customers',data:'Data',general:'General'};
function pToday(p){
  const d=dn();let list=D.tasks.map(t=>Object.assign({},t,{done:d[t.id]??t.done}));
  if(O.f==='open')list=list.filter(t=>!t.done);else if(O.f!=='all')list=list.filter(t=>t.area===O.f);
  list.sort((a,b)=>(a.done-b.done)||(['high','med','low'].indexOf(a.priority)-['high','med','low'].indexOf(b.priority)));
  p.innerHTML=sec(T("Today's tasks"))+chips([['open','Open'],['all','All'],['stock','Stock'],['money','Money'],['data','Data']],O.f,'f')+
  `<div class="ops-list">${list.map(t=>{const [c,tg,tl]=PRI[t.priority];return `<button class="ops-task" data-t="${t.id}" style="--sc:${t.done?'var(--ok)':c}"><i class="${t.done?'on':''}"></i><div><b style="${t.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.title)}</b><span>${ar(T(AREA[t.area]||'General'))}${t.done?' · '+ar(T('done by'))+' '+esc(t.by||''):t.age?' · '+ar(age(t.age)):''}${t.src==='ai'?' · '+ar(T('from AI review')):''}</span></div><span class="tag ${t.done?'t-ok':tg}">${ar(T(t.done?'Done':tl))}</span></button>`;}).join('')||`<div class="empty">${ar(T('Nothing here.'))}</div>`}</div>
  <form class="ops-add" id="opsAdd"><input placeholder="${T('Add a task for the team…')}" id="opsNew" autocomplete="off"><button type="submit">${ar(T('Add'))}</button></form>`;
  p.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{O.f=b.dataset.f;render();});
  p.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const x=dn();const t=D.tasks.find(z=>z.id===b.dataset.t);x[t.id]=!(x[t.id]??t.done);store.set('opsdone',x);render();});
  $('#opsAdd').onsubmit=e=>{e.preventDefault();const v=$('#opsNew').value.trim();if(!v)return;D.tasks.unshift({id:'t'+Date.now(),title:v,area:'general',priority:'med',age:0,done:false});toast(T('Added (demo)'));render();};
}
function pRem(p){
  const s=sent();let list=D.reminders.slice();
  if(O.rf==='todo')list=list.filter(r=>!s[r.key]&&r.kind!=='flag');if(O.rf==='sent')list=list.filter(r=>s[r.key]);if(O.rf==='warn')list=list.filter(r=>r.kind!=='ready');
  p.innerHTML=sec(T('Engine oil reminders'),ar(T('30 days late → next 7 days')))+chips([['todo','Not sent'],['sent','Sent'],['warn','Needs a check']],O.rf,'rf')+
  `<div class="ops-list">${list.map(r=>`<div class="ops-card${s[r.key]?' off':''}"><div class="h"><b>${esc(r.client)}</b><span>${ar(due(r.due))}</span></div><span class="sub">${esc(r.car)} · ${ar(T('engine oil'))}</span>
    ${r.kind==='flag'?`<span class="tag t-bad">⛔ ${esc(r.flag)}</span>`:r.kind==='check'?`<span class="tag t-warn">🔎 ${ar(T('Check in the system: did he come back?'))}</span>`:''}
    <div class="acts"><button class="wa" data-wa="${r.key}">WhatsApp</button><button data-sent="${r.key}">${ar(T(s[r.key]?'Undo':'Mark sent'))}</button></div></div>`).join('')||`<div class="empty">${ar(T('All reminders sent.'))} 👌</div>`}</div>`;
  p.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{O.rf=b.dataset.rf;render();});
  p.querySelectorAll('[data-sent]').forEach(b=>b.onclick=()=>{const x=sent();x[b.dataset.sent]=!x[b.dataset.sent];store.set('opssent',x);render();});
  p.querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>{const r=D.reminders.find(x=>x.key===b.dataset.wa);const msg='السلام عليكم،\nوفقاً لسجلاتنا قد يكون حان موعد تغيير زيت المحرك لسيارتكم '+r.car+'.\nوفي حال أُجريت الخدمة لدينا مؤخراً فنعتذر عن هذا التذكير.\n\nورشة عالم الخدمات السريعة';if(navigator.clipboard)navigator.clipboard.writeText(msg).catch(()=>{});toast(T('Demo: message copied.'));});
}
function pStock(p){
  const rows=D.stock.slice().sort((a,b)=>a.days-b.days);
  p.innerHTML=sec(T('Stock by burn rate'),ar(T('red = under 14 days')))+`<div class="ops-list">${rows.map(r=>{const c=r.days<=14?'var(--bad)':r.days<=30?'var(--warn)':'var(--ok)';const pct=Math.max(4,Math.min(100,r.days/120*100));return `<div class="nh-row"><b>${esc(r.n)}</b><span class="r">${r.q}${r.u==='L'?' L':''}<small>${r.wk}${r.u==='L'?' L':''}${T('/wk')}</small></span><span class="m">${ar(T('lasts'))} ${r.days} ${ar(T('days'))}${r.days<=14?' · <span class="tag t-bad">'+ar(T('Order'))+'</span>':''}</span><div class="nh-bar"><i style="width:${pct}%;background:${c}"></i></div></div>`;}).join('')}</div>`;
}
function pOrders(p){
  const od=ord();
  p.innerHTML=sec(T('Suggested orders'),'⭐ '+ar(T('cheapest supplier')))+`<div class="ops-list">${D.orders.map((o,i)=>{const tot=o.items.reduce((a,x)=>a+(od[o.vendor+'|'+x.n]??x.q)*x.p,0);return `<div class="ops-card${od['sent|'+o.vendor]?' off':''}"><div class="h"><b>${esc(o.vendor)}</b><span>${o.items.length} ${ar(T('items'))}</span></div>
    ${o.items.map(x=>{const k=o.vendor+'|'+x.n;const q=od[k]??x.q;return `<div class="oi"><i class="${q>0?'on':''}" data-tg="${k}"></i><div><b>${esc(x.n)}${x.pref?' ⭐':''}</b><span>${f3(x.p)} ${ar(T('each'))}</span></div><div class="st"><button data-q="${k}|-1">−</button><em>${q}</em><button data-q="${k}|1">+</button></div></div>`;}).join('')}
    <div class="tot"><span>${ar(T('Order total (cost)'))}</span><b>${f3(tot)} OMR</b></div>
    <div class="acts"><button data-msg="${i}">${ar(T('Copy message'))}</button><button class="ok" data-os="${o.vendor}">${ar(T(od['sent|'+o.vendor]?'Ordered':'Mark ordered'))}${od['sent|'+o.vendor]?' ✓':''}</button></div></div>`;}).join('')}</div>`;
  p.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const [v,n,dd]=b.dataset.q.split('|');const k=v+'|'+n;const o=ord();const x=D.orders.find(z=>z.vendor===v).items.find(z=>z.n===n);o[k]=Math.max(0,(o[k]??x.q)+(+dd));store.set('opsord',o);render();});
  p.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{const k=b.dataset.tg;const o=ord();const [v,n]=k.split('|');const x=D.orders.find(z=>z.vendor===v).items.find(z=>z.n===n);o[k]=(o[k]??x.q)>0?0:x.q;store.set('opsord',o);render();});
  p.querySelectorAll('[data-os]').forEach(b=>b.onclick=()=>{const o=ord();o['sent|'+b.dataset.os]=!o['sent|'+b.dataset.os];store.set('opsord',o);render();});
  p.querySelectorAll('[data-msg]').forEach(b=>b.onclick=()=>{const o=D.orders[+b.dataset.msg];const od2=ord();const t='السلام عليكم، نرجو توفير:\n'+o.items.filter(x=>(od2[o.vendor+'|'+x.n]??x.q)>0).map(x=>'• '+x.n+' × '+(od2[o.vendor+'|'+x.n]??x.q)).join('\n')+'\n\nورشة عالم الخدمات السريعة · 9470 2061';if(navigator.clipboard)navigator.clipboard.writeText(t).catch(()=>{});toast(T('Order message copied'));});
}
function chartSvg(vals,vals2){const mx=Math.max(...vals)*1.15;let b='';vals.forEach((v,i)=>{const x=20+i*47;const bh=v/mx*140;b+=`<rect x="${x}" y="${160-bh}" width="18" height="${bh}" rx="4" fill="#ee3a39" opacity=".85"/>`;if(vals2){const ph=vals2[i]/mx*140;b+=`<rect x="${x+20}" y="${160-ph}" width="12" height="${ph}" rx="4" fill="#f27b21"/>`;}});return `<svg viewBox="0 0 600 180">${b}<line x1="10" y1="160" x2="590" y2="160" stroke="#2a2a2e"/></svg>`;}
function pMoney(p){
  const m=D.money;
  p.innerHTML=`<div class="ops-two"><div>${sec(T('Open invoices'),`OMR ${f3(m.due)} · ${m.over30} ${ar(T('older than 30 days'))}`)}
  <div class="ops-card pad0">${m.open.slice().sort((a,b)=>b.age-a.age).map(o=>`<div class="mrow"><div><b>${esc(o.client)}</b><span>#${o.no} · ${esc(o.car)}</span></div><div class="v">${f3(o.amt)}<small style="${o.age>30?'color:var(--bad)':''}">${o.age} ${ar(T('days'))}</small></div></div>`).join('')}</div></div>
  <div>${sec(T('Who owes the most'))}<div class="ops-list">${m.debtors.map(([n,v])=>`<div class="nh-row"><b>${esc(n)}</b><span class="r">${f3(v)}<small>OMR</small></span><span class="m">${Math.round(v/m.due*100)}% ${ar(T('of what is due'))}</span><div class="nh-bar"><i style="width:${Math.round(v/m.due*100)}%;background:var(--orange)"></i></div></div>`).join('')}</div></div></div>`;
}
function pPerf(p){
  const w=D.perf.weeks;const pr=w.map(v=>Math.round(v*0.41));
  p.innerHTML=`<div class="ops-card">${sec(T('Sales & profit · 12 weeks'),`<i class="sw" style="background:#ee3a39"></i>${ar(T('Sales'))} &nbsp; <i class="sw" style="background:#f27b21"></i>${ar(T('Profit'))}`)}${chartSvg(w,pr)}</div>
  <div class="ops-two"><div>${sec(T('This week, day by day'))}<div class="ops-card pad0 tbl"><div class="r h"><span>${ar(T('Day'))}</span><span>${ar(T('Invoices'))}</span><span>${ar(T('Sales'))}</span><span>${ar(T('Profit'))}</span></div>${D.perf.days.map(d=>`<div class="r"><span>${ar(T(d[0]))}</span><span>${d[1]}</span><span>${f3(d[2])}</span><span>${f3(d[3])}</span></div>`).join('')}</div></div>
  <div>${sec(T('Top services this week'))}<div class="ops-list">${D.perf.top.map(([n,c])=>`<div class="nh-row"><b>${esc(n)}</b><span class="r">${c}<small>${ar(T('jobs'))}</small></span><span class="m"></span><div class="nh-bar"><i style="width:${Math.round(c/D.perf.top[0][1]*100)}%;background:var(--red)"></i></div></div>`).join('')}</div></div></div>`;
}
function pCount(p){
  const c=cnt();
  p.innerHTML=sec(T('Daily count')+' · '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'}),`${Object.keys(c).length}/${D.count.length}`)+`<p class="hint">${ar(T('Count the shelf first, then type the number. The system figure shows after you save.'))}</p>
  <div class="ops-list">${D.count.map((it,i)=>`<div class="ops-card cnt${c[it.n]!=null?' done':''}"><b>${esc(it.n)}</b><span class="sub">${esc(it.en)}</span>${c[it.n]!=null?`<span class="sub" style="color:var(--ok)">${ar(T('Counted'))}: <b>${c[it.n]}</b> · ${ar(T('system: — (with live data)'))}</span>`:`<div class="row"><input inputmode="decimal" placeholder="${T('How many on the shelf?')}" id="oc${i}"><button data-c="${i}">${ar(T('Save'))}</button></div>`}</div>`).join('')}</div>
  <button class="btn ghost sm" id="occlr">${ar(T('Reset today (demo)'))}</button>`;
  p.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const i=+b.dataset.c;const v=$('#oc'+i).value.trim();if(!v)return;const x=cnt();x[D.count[i].n]=v;store.set('opscount',x);render();});
  $('#occlr').onclick=()=>{store.set('opscount',{});render();};
}
function pAI(p){
  const hist=store.get('opsai',[]);
  p.innerHTML=`<div class="ops-card ai">${sec(T('Ask the workshop AI'),ar(T('demo answers')))}
    <div class="q">${['Top 3 things today','Who owes the most?','Order message for Mannol'].map(q=>`<button data-ask="${esc(q)}">${ar(T(q))}</button>`).join('')}</div>
    <div class="bubs">${hist.map(h=>`<div class="bub${h.me?' me':''}">${esc(h.t)}</div>`).join('')}</div>
    <form id="opsAsk"><input id="opsAskI" placeholder="${T("Ask about today's data…")}" autocomplete="off"><button type="submit">${ar(T('Ask'))}</button></form>
    <p class="hint">${ar(T('The real version answers from the night report. It needs an AI key (small cost per question).'))}</p></div>`;
  const ask=q=>{const h=store.get('opsai',[]);h.push({me:1,t:q});const a=/top|first|today|أهم|اليوم/i.test(q)?'1) Order G11 coolant and Toyota 0W-20 (both under 2 weeks).\n2) Collect invoice #313 from Alsharqiya University (41 days).\n3) Send 4 oil reminders that are ready.':/owe|debt|فلوس/i.test(q)?'Alyazeedi family OMR 486.200 (52%), Alsharqiya University 142.500, Al Riyami 86.000.':/order|mannol|مانول|طلب/i.test(q)?'السلام عليكم، نرجو توفير: G11 ×8، DOT-4 ×10، 0W-16 5L ×4. ورشة عالم الخدمات السريعة':'Demo answer. The live version reads the night report and answers from it.';h.push({t:a});store.set('opsai',h.slice(-8));render();};
  p.querySelectorAll('[data-ask]').forEach(s=>s.onclick=()=>ask(s.dataset.ask));
  $('#opsAsk').onsubmit=e=>{e.preventDefault();const v=$('#opsAskI').value.trim();if(v)ask(v);};
}
window.FSW_SEC={ops:renderOps};
};
</script>
<script>window.FSW_APP_NAME="1.5.10";
(function(){
"use strict";
const BASE=window.FSW_BASE||'https://raw.githubusercontent.com/Sulaiman9O/fsw-app/main/docs/';
const $=s=>document.querySelector(s);

function useData(d){

    md=MD_FIX[(mk+'|'+md).toLowerCase()]||md;
    const e=add(mk,md);e.n+=c[2];e.suv+=c[3]*c[2];e.suvN+=c[2];e.rows.push(...c[4]);
    (c[5]||[]).forEach(([k,n])=>e.oil[k]=(e.oil[k]||0)+n);(c[6]||[]).forEach(([k,n])=>e.fil[k]=(e.fil[k]||0)+n);

const S={user:null,tab:'quote',make:null,model:null,year:null,eng:null,visc:null,picked:new Set(),labOn:true,suv:0,fi:null,L:null,extras:new Set(),own:false,disc:0,discMode:'amt',sheet:null};

/* ---------- calculation ---------- */
const prettyOil=d=>d.replace(/\b(Motor|Engine)\s+Oil\b/ig,'').replace(/\b\d+\s*l(trs?)?\b/ig,'').replace(/\(.*?\)/g,'').replace(/\b(F\/S|S\/S|S\/L)\b/g,'').replace(/\b\d{4,}(\/\d{4,})?\b/g,'').replace(/\s{2,}/g,' ').trim();
const filterName=f=>f[0].replace(/Oil Filter/i,'').replace(/\s{2,}/g,' ').trim();
function findFilter(code){if(!code)return -1;const c=nrm(code);let i=D.filters.findIndex(f=>f[1]===c);if(i<0)i=D.filters.findIndex(f=>nrm(f[0]).includes(c)||(c.length>6&&c.includes(f[1])));return i;}
function enginesFor(c){if(!c||!c.eng.length)return [];const y=S.year;return y?c.eng.filter(e=>y>=e[1]&&y<=e[2]):c.eng;}
function histRow(c,L){let rows=c.rows.filter(r=>r[1]>=2.5);if(L)rows=rows.filter(r=>Math.abs(r[1]-L)<=0.8).concat(rows.filter(r=>Math.abs(r[1]-L)>0.8).map(r=>[...r,'far']));const y=S.year||0;const yd=r=>r[0]?Math.abs(r[0]-y):99;rows.sort((a,b)=>(a[4]==='far')-(b[4]==='far')||(y?yd(a)-yd(b):b[0]-a[0]));return rows[0]||null;}
function filterRanks(c,recCode){const rec=findFilter(recCode);const ok=new Set();Object.keys(c.fil).forEach(k=>{const i=findFilter(k);if(i>=0)ok.add(i);});if(rec>=0){const code=D.filters[rec][1];GROUPS.forEach(g=>{if(g.includes(code))g.forEach(x=>{const i=findFilter(x);if(i>=0)ok.add(i);});});}ok.delete(rec);return {rec,ok};}
const stockViscs=()=>[...new Set(D.oils.map(o=>o[1]).filter(Boolean))].sort((a,b)=>parseInt(a)-parseInt(b)||a.localeCompare(b));
function defaultVisc(c,eng){const vs=stockViscs();if(eng&&eng[5]&&vs.includes(eng[4]))return eng[4];const t={};Object.entries(c.oil).forEach(([k,n])=>{const v=k.split('|')[1];if(vs.includes(v))t[v]=(t[v]||0)+n;});const top=Object.entries(t).sort((a,b)=>b[1]-a[1])[0];if(top)return top[0];if(eng&&vs.includes(eng[4]))return eng[4];return '5W-30';}
function scenario(){
  const c=car();if(!c)return null;const engs=enginesFor(c);
  const eng=engs.length===1?engs[0]:(S.eng!=null&&engs[S.eng]?engs[S.eng]:null);
  const hr=histRow(c,eng?eng[3]:0);
  const fr=filterRanks(c,hr?hr[3]:'');
  const histL=hr&&hr[4]!=='far'?hr[1]:(!eng&&hr?hr[1]:0);
  const specL=eng?eng[3]:0;
  const L=S.L||histL||specL;
  const fi=S.fi!=null?S.fi:fr.rec;
  const visc=S.visc||defaultVisc(c,eng);
  return {c,eng,hr,fr,L,fi,visc,histL,specL};
}
function extrasTotal(){let t=0;S.extras.forEach(id=>{const e=EXTRAS.find(x=>x.id===id);if(e)t+=e.price[S.suv]||0;});return t;}
function lineFor(sc,o,i){
  const oilCost=S.own?0:sc.L*o[2];
  const f=sc.fi>=0?D.filters[sc.fi]:null;const fp=f?f[2]:0;
  const lab=S.labOn?D.lab[S.suv]:0;const ex=extrasTotal();
  const sub=oilCost+fp+lab+ex;
  const disc=S.disc?(S.discMode==='pct'?sub*S.disc/100:Math.min(S.disc,sub)):0;
  const total=Math.max(0,sub-disc);
  const used=sc.c.oil[bk(o[0])+'|'+o[1]]||0;
  return {i,o,name:prettyOil(o[0]),visc:o[1],per:o[2],stock:o[3],rank:o[4]==null?99:o[4],oil:oilCost,fp,lab,ex,disc,total,used};
}
function oilList(sc){
  const rows=D.oils.map((o,i)=>[o,i]).filter(([o])=>o[1]===sc.visc).map(([o,i])=>lineFor(sc,o,i));
  if(!rows.length)return rows;
  const inStock=rows.filter(r=>r.stock>=sc.L);
  const best=(inStock.length?inStock:rows).reduce((a,b)=>b.rank<a.rank?b:a);
  const rest=rows.filter(r=>r!==best).sort((a,b)=>(b.stock>0)-(a.stock>0)||b.used-a.used||a.total-b.total);
  best.top=true;const mu=rest.find(r=>r.used>0);if(mu)mu.mostUsed=true;else if(best.used>0)best.mostUsed=true;
  return [best,...rest];

const CARPICS=()=>Object.assign({},store.get('carpics',{}),MEM.carpics||{});
const isSuv=c=>c&&c.suvN&&c.suv*2>=c.suvN;
function carPic(c){const p=c?CARPICS()[c.mk+'|'+c.md]:null;return p?`<img class="photo" src="${p}" alt="">`:`<svg viewBox="0 0 200 120"><use href="#${isSuv(c)?'suvR':'sedanR'}"/></svg>`;}
function shrinkImage(file,maxW,type,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,maxW/im.width);const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(type,0.82));};im.src=r.result;};r.readAsDataURL(file);}

function prepCarPhoto(file,cb){shrinkImage(file,800,'image/jpeg',cb);} /* keep the whole photo; it fades into the card */
function trimLogo(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);
  let d;try{d=x.getImageData(0,0,c.width,c.height).data;}catch(e){d=null;}
  let x0=c.width,y0=c.height,x1=-1,y1=-1;
  if(d)for(let y=0;y<c.height;y++)for(let i=0;i<c.width;i++){const k=(y*c.width+i)*4;const a=d[k+3];const wh=d[k]>235&&d[k+1]>235&&d[k+2]>235;if(a>20&&!wh){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y;}}
  if(x1<0){x0=0;y0=0;x1=c.width-1;y1=c.height-1;}
  const w=x1-x0+1,h=y1-y0+1,S=160,pad=8,s=Math.min((S-pad*2)/w,(S-pad*2)/h);
  const o=document.createElement('canvas');o.width=S;o.height=S;const ox=o.getContext('2d');ox.fillStyle='#fff';ox.fillRect(0,0,S,S);
  ox.imageSmoothingQuality='high';ox.drawImage(c,x0,y0,w,h,(S-w*s)/2,(S-h*s)/2,w*s,h*s);cb(o.toDataURL('image/png'));};im.src=r.result;};r.readAsDataURL(file);}

/* ---------- pin pad ---------- */
function pad(){return `<div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button class="key${k==='⌫'?' ghost':''}" data-k="${k}" aria-label="${k==='⌫'?'Delete':k}">${k}</button>`).join('')}</div>`;}
function dots(n){return `<div class="dots">${[0,1,2,3].map(i=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>`;}
function bindPad(onDigit){document.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>onDigit(b.dataset.k));}

/* ---------- first start: create owner ---------- */
let setup={step:'name',name:'Sulaiman',pin:'',pin1:''};
function renderSetup(){
  const st=setup;let body='';
  if(st.step==='name')body=`<h2>Set up this device</h2><p>Owner name</p><input class="field" id="oname" value="${esc(st.name)}" autocomplete="off"><button class="btn" id="next">Next</button>`;
  else body=`<h2>${st.step==='pin'?'Choose owner PIN (4 numbers)':'Enter the PIN again'}</h2>${dots(st.pin.length)}${pad()}<div class="err" id="err"></div>`;
  $('#root').innerHTML=`<div class="login"><div class="in"><img class="logo" src="${LOGO_IMG}" alt="Fast Service World">${body}</div></div>`;
  if(st.step==='name'){$('#next').onclick=()=>{st.name=$('#oname').value.trim()||'Owner';st.step='pin';renderSetup();};return;}
  bindPad(async k=>{
    if(k==='⌫')st.pin=st.pin.slice(0,-1);else if(st.pin.length<4)st.pin+=k;
    if(st.pin.length===4){
      if(st.step==='pin'){st.pin1=st.pin;st.pin='';st.step='pin2';renderSetup();return;}
      if(st.pin!==st.pin1){st.pin='';st.step='pin';renderSetup();$('#err').textContent='PINs did not match. Try again.';return;}
      const u={id:'owner',name:st.name,role:'admin',pin:await hashPin(st.pin),color:COLORS[0]};
      saveUsers([u]);S.user=u;store.set('user',u.id);render();return;
    }
    renderSetup();
  });
}

/* ---------- login ---------- */
let pinBuf='',pickUser=null;
function initials(n){const p=String(n).trim().split(/\s+/);return esc((p[0]||'?')[0]+(p[1]?p[1][0]:''));}
function renderLogin(){
  const us=users();
  if(!us.length&&navigator.onLine&&!SYNC.usersLoaded&&Date.now()-SYNC.start<9000){$('#root').innerHTML=`<div class="login"><div class="in"><img class="logo" src="${LOGO_IMG}" alt="Fast Service World"><p>Connecting…</p></div></div>`;setTimeout(()=>{if(!S.user)renderLogin();},1500);return;}
  if(!us.length){renderSetup();return;}
  if(us.length===1&&!pickUser)pickUser=us[0].id;
  $('#root').innerHTML=`<div class="login"><div class="in">
    <img class="logo" src="${LOGO_IMG}" alt="Fast Service World">
    <h2>Who is working today?</h2>
    <div class="people">${us.map(u=>`<button class="person${pickUser===u.id?' sel':''}" data-u="${u.id}"><span class="av">${initials(u.name)}</span>${esc(u.name)}<small>${u.role==='admin'?'Owner':'Staff'}</small></button>`).join('')}</div>
    ${pickUser?dots(pinBuf.length)+pad():'<p>Tap your name</p>'}
    <div class="err" id="err"></div>
  </div></div>`;
  document.querySelectorAll('.person').forEach(b=>b.onclick=()=>{pickUser=b.dataset.u;pinBuf='';renderLogin();});
  bindPad(async k=>{
    if(k==='⌫')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;
    if(pinBuf.length===4){const u=users().find(x=>x.id===pickUser);const h=await hashPin(pinBuf);pinBuf='';
      if(u&&u.pin===h){S.user=u;store.set('user',u.id);render();return;}
      renderLogin();$('#err').textContent='Wrong PIN. Try again.';return;}
    renderLogin();
  });
}

/* ---------- app shell ---------- */
const TABS_OLD=[['quote','i-calc','Oil price'],['rem','i-bell','Reminders'],['hist','i-list','History'],['set','i-gear','Settings']];
const TABS_NEW=[['home','i-home','Home'],['quote','i-calc','Oil price'],['hist','i-list','History'],['set','i-gear','Settings']];
/* "New home (test)": owner turns it on per device in Settings. Off = the app as before. */
const DEF=window.FSW_DEFAULTS||{};
const newHome=()=>store.get('newhome',!!DEF.newhome);
const TABS_NOW=()=>newHome()?TABS_NEW:TABS_OLD;
function navButtons(){return TABS_NOW().map(([k,ic,l])=>`<button class="navb" data-tab="${k}" ${S.tab===k?'aria-current="page"':''}><svg><use href="#${ic}"/></svg>${l}${k==='rem'?'<span class="soon">SOON</span>':''}</button>`).join('');}
function render(){
  if(!S.user){renderLogin();return;}
  if(!D){$('#root').innerHTML='<div class="empty" style="padding-top:80px">No prices on this device yet. Connect to the internet and open the app again.</div>';return;}
  const when=new Date(D.asof).toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'Asia/Muscat'});
  if(S.tab==='home'&&!newHome())S.tab='quote';
  const title={home:S.sec?((SECS[S.sec]||(window.FSW_EXTRA||{})[S.sec]||{}).t||'FSW'):'FSW',quote:'Oil Price',rem:'Reminders',hist:'History',set:'Settings'}[S.tab];
  const y=window.scrollY;
  $('#root').innerHTML=`<div class="shell">
    <header class="top"><img class="em" src="${EMBLEM_IMG}" alt=""><span class="t">${title}</span><div class="me"><span>Prices<br>${when}</span><span class="av me">${initials(S.user.name)}</span></div></header>
    <nav class="rail"><img class="em" src="${EMBLEM_IMG}" alt="FSW">${navButtons()}<span class="av me" title="${esc(S.user.name)}">${initials(S.user.name)}</span></nav>

/* ---------- Read the ملكية (registration card) with on-device OCR ---------- */
const VIN_FIX={O:'0',Q:'0',I:'1',L:'1',S:'5',B:'8',Z:'2',G:'6'};
function vinCandidates(text){
  const out=[];const T=(text||'').toUpperCase().replace(/[^A-Z0-9\n ]/g,' ');
  (T.match(/[A-Z0-9]{15,20}/g)||[]).forEach(w=>{
    let v=w.replace(/[OQ]/g,'0').replace(/I/g,'1');
    if(v.length===17)out.push(v);
    else if(v.length>17){for(let i=0;i+17<=v.length;i++)out.push(v.slice(i,i+17));}
  });
  // sometimes the VIN is split by a space: join pairs
  const parts=T.split(/\s+/);
  for(let i=0;i<parts.length-1;i++){const j=(parts[i]+parts[i+1]).replace(/[OQ]/g,'0').replace(/I/g,'1');if(j.length===17&&/^[A-HJ-NPR-Z0-9]{17}$/.test(j))out.push(j);}
  return [...new Set(out.filter(v=>/^[A-HJ-NPR-Z0-9]{17}$/.test(v)&&/\d/.test(v)))];
}
function vinCheck(v){ // North-American style check digit; many Asian/EU VINs do not use it, so this is only a hint
  const map={A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,J:1,K:2,L:3,M:4,N:5,P:7,R:9,S:2,T:3,U:4,V:5,W:6,X:7,Y:8,Z:9};
  const wt=[8,7,6,5,4,3,2,10,0,9,8,7,6,5,4,3,2];let sum=0;
  for(let i=0;i<17;i++){const c=v[i];sum+=(/\d/.test(c)?+c:map[c]||0)*wt[i];}
  const r=sum%11;return v[8]===(r===10?'X':String(r));
}
const AR_PLATE=/[ء-ي]/;
function parseMulkiya(res){
  const lat=(res.latin||[]).map(l=>l.t);const all=lat.join('\n');const ar=res.arabic||'';
  const o={raw:all+'\n---\n'+ar};
  // VIN
  const vins=vinCandidates(all);if(vins.length){vins.sort((a,b)=>vinCheck(b)-vinCheck(a));o.vin=vins[0];}
  // year
  const noDates=all.replace(/\d{1,2}[\/.-]\d{1,2}[\/.-](19|20)\d\d/g,' ');
  const yrs=(noDates.match(/\b(19[89]\d|20[0-4]\d)\b/g)||[]).map(Number);
  const yl=lat.find(l=>/YEAR|سنة الصنع/i.test(l)&&!/EXP|ISSUE|انتهاء|اصدار|إصدار/i.test(l));const ym=yl&&yl.replace(/\d{1,2}[\/.-]\d{1,2}[\/.-](19|20)\d\d/g,' ').match(/\b(19[89]\d|20[0-4]\d)\b/);
  if(ym)o.year=+ym[1];else if(yrs.length)o.year=Math.max(...yrs.filter(y=>y<=new Date().getFullYear()+1));
  // make / model: match against our car list
  const U=all.toUpperCase();let best=null;
  Object.values(CARS).forEach(c=>{const mk=c.mk.toUpperCase(),md=c.md.toUpperCase();const hit=(U.includes(md)?2:0)+(U.includes(mk)?1:0);if(hit>(best?best.hit:0))best={hit,c};});
  if(best){o.make=best.c.mk;if(best.hit>=2)o.model=best.c.md;}
  // plate: digits (1-5) + Arabic letter(s). Digits from the Latin pass, letters from the Arabic pass.
  const pl=lat.find(l=>/PLATE|REG|رقم/i.test(l))||'';
  const digs=(pl.match(/\b\d{1,5}\b/)||all.match(/\b\d{3,5}\b(?![\d,.])/)||[])[0];
  const arLines=ar.split('\n').map(x=>x.trim()).filter(Boolean);
  let letters='';
  for(const L of arLines){const m=L.match(/(\d{1,5})\s*([ء-ي]{1,2})(?![ء-ي])/)||L.match(/([ء-ي]{1,2})\s*(\d{1,5})/);if(m){const d=m[1].match(/\d/)?m[1]:m[2];const a=m[1].match(/\d/)?m[2]:m[1];if(!digs||d===digs){o.plate=d+' '+a;letters=a;break;}}}
  if(!o.plate&&digs)o.plate=digs;
  // owner name: the longest Arabic-only line that is not a known label
  const names=arLines.filter(L=>AR_PLATE.test(L)&&!/\d/.test(L)&&L.length>=6&&!/سلطنة|شرطة|عمان|مركبة|ملكية|رقم|اللوحة|الشاصي|المالك|النوع|الموديل|اللون|السنة|تاريخ|الانتهاء|الجنسية/.test(L));
  if(names.length)o.name=names.sort((a,b)=>b.length-a.length)[0];
  return o;
}
async function readMulkiya(dataUrl,onDone){
  const P=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.FswOcr;
  if(!P){toast('Reading the card needs the new app version.');return;}
  toast('Reading the card…');
  try{const res=await P.read({image:dataUrl,arabic:true});const o=parseMulkiya(res);LAST_OCR=o;onDone(o);}
  catch(e){toast('Could not read: '+(e&&e.message||e));}
}

const VIN_YEAR='ABCDEFGHJKLMNPRSTVWXY123456789';
function vinDecode(v){
  if(!v||v.length!==17)return null;
  let w=WMI.find(x=>v.startsWith(x[0])&&x[0].length===3)||WMI.find(x=>v.startsWith(x[0]));
  const i=VIN_YEAR.indexOf(v[9]);let year=null;
  if(i>=0){const y1=1980+i,y2=2010+i;year=(y2<=new Date().getFullYear()+1)?y2:y1;} // letters repeat every 30 years
  return {make:w?w[1]:null,country:w?w[2]:null,year,check:vinCheck(v)};
}
async function vinOnline(v){
  const r=await fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/'+encodeURIComponent(v)+'?format=json');
  if(!r.ok)throw new Error('HTTP '+r.status);
  const d=(await r.json()).Results[0];const g=k=>(d[k]||'').trim();
  return {make:g('Make'),model:g('Model'),year:g('ModelYear'),engine:[g('DisplacementL')&&g('DisplacementL')+' L',g('EngineCylinders')&&g('EngineCylinders')+'-cyl',g('EngineModel')].filter(Boolean).join(' · '),fuel:g('FuelTypePrimary'),body:g('BodyClass'),plant:[g('PlantCity'),g('PlantCountry')].filter(Boolean).join(', '),maker:g('Manufacturer'),err:g('ErrorCode')!=='0'?g('ErrorText'):''};
}

const STAGES=[['new','New','var(--red)'],['work','Working','var(--orange)'],['ready','Ready','var(--ok)'],['done','Delivered','var(--dim)']];
const stg=k=>STAGES.find(x=>x[0]===k);
const hm=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Muscat'});
const fmtD=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Muscat'});
const kmf=n=>(+n||0).toLocaleString('en-US');
const waNum=t=>{let d=(t||'').replace(/\D/g,'');if(d.length===8)d='968'+d;return d;};
const plateFmt=v=>(v||'').toUpperCase().replace(/[^A-Z0-9\u0600-\u06FF ]/g,'').replace(/\s+/g,' ').trim();const vinFmt=v=>(v||'').toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,'');
const testBar='<div class="jb-test">TEST · CLEARED WHEN THE APP CLOSES</div>';
function shrinkPhoto(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8));};im.src=r.result;};r.readAsDataURL(f);}

function jobTotals(j){let parts=0,labour=0;(j.items||[]).forEach(it=>{if(it.pend)return;const a=(+it.q||0)*(+it.p||0);if(it.k==='labour')labour+=a;else parts+=a;});const sub=parts+labour;const disc=Math.min(+j.disc||0,sub);return {parts,labour,sub,disc,total:Math.max(0,sub-disc)};}
const itemLine=it=>it.d+(it.sub?' ('+it.sub+')':'')+(it.pend?': price pending':(it.q!==1||it.u?': '+(+it.q)+(it.u?' '+it.u:'')+' × '+f3(it.p)+' = ':': ')+(it.pend?'':f3(it.q*it.p)));
const COMMON_ITEMS=[['Air filter','part',4.5],['Cabin (AC) filter','part',3.5],['Spark plugs','part',3.5],['Battery','part',30],['Wiper blades (pair)','part',5],['Coolant (L)','part',1.75],['Brake pads front','part',18],['Brake pads rear','part',15],['Brake fluid','part',3],['Gearbox oil (L)','part',3.5],['Power steering oil','part',3],['Tyre','part',25],['Bulb','part',1.5],['Fuse','part',0.5],['Labour — brakes','labour',12],['Labour — spark plugs','labour',8],['Labour — AC service','labour',15],['Labour — diagnosis','labour',5],['Labour — tyre change','labour',2],['Labour — wheel alignment','labour',8],['Labour — battery','labour',2],['Labour — other','labour',5]];
const ETAS=[[30,'30 min'],[60,'1 hour'],[120,'2 hours'],[180,'3 hours'],[1440,'Tomorrow']];
const etaText=j=>j.eta?(j.eta-Date.now()>12*3600e3?'tomorrow':'~'+hm(j.eta)):'';
function jobText(j){const T=jobTotals(j);return 'Job #'+j.no+': '+j.car+(j.pl?' · '+j.pl:'')+(j.nm?'\nCustomer: '+j.nm:'')+(j.vin?'\nVIN: '+j.vin:'')+'\n'+(j.items||[]).map(it=>'- '+itemLine(it)).join('\n')+(T.disc?'\nDiscount: −'+f3(T.disc):'')+'\nTotal: '+f3(T.total)+' OMR'+(j.km?'\nKm: '+kmf(j.km):'')+(j.tel?'\nPhone: '+j.tel:'')+'\nBy: '+j.by;}
function setStage(j,k){j.stage=k;j.log.push([Date.now(),stg(k)[1]+' · '+S.user.name]);if(k==='done'&&!REMS.some(r=>r.job===j.id))addRem(j,(j.iv||{}).km||7000,6);}
function addRem(j,step,months){const n=new Date();n.setMonth(n.getMonth()+months);const old=REMS.find(r=>r.job===j.id);const r={job:j.id,car:j.car,tel:j.tel,oil:j.oil,km:j.km,nextKm:j.km?j.km+step:0,next:n.getTime(),t:Date.now()};if(old)Object.assign(old,r);else REMS.push(r);}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied');}catch(e){toast('Could not copy');}}
function renderJobs(m,hd){
  const j=S.job&&JOBS.find(x=>x.id===S.job);
  if(!j){
    S.job=null;const f=S.jf||'open';
    const cnt=k=>JOBS.filter(x=>k==='open'?x.stage!=='done':x.stage===k).length;
    const list=JOBS.filter(x=>f==='open'?x.stage!=='done':x.stage===f);
    m.innerHTML=hd+testBar+`<div class="jb-chips">${[['open','Open']].concat(STAGES.map(x=>[x[0],x[1]])).map(([k,l])=>`<button data-jf="${k}" aria-pressed="${f===k}">${l}<span>${cnt(k)}</span></button>`).join('')}</div>
    <button class="btn okb" data-newjob><svg><use href="#i-calc"/></svg>New job from a price</button>
    ${list.length?`<div class="nh-list">${list.map(x=>{const s=stg(x.stage);return `<button class="jb-item" data-job="${x.id}" style="--sc:${s[2]}"><div class="no">#${x.no}</div><div class="tx"><b>${esc(x.car)}${x.pl?` <span class="pl">${esc(x.pl)}</span>`:''}</b><span>${x.nm?esc(x.nm)+' · ':''}${esc(x.oil)}${x.L?' · '+x.L+' L':''}</span><span>${hm(x.t)} · ${esc(x.by)}</span></div><div class="rt"><b>${f3(jobTotals(x).total)}</b><span class="st">${s[1]}${x.stage==='work'&&x.eta?' · '+etaText(x):''}</span></div></button>`;}).join('')}</div>`
      :`<div class="empty"><span style="font-size:2.2rem">🔧</span>${JOBS.length?'Nothing here.':'No jobs yet. Pick a car in Oil price, choose the oil, then tap <b>Start job</b>.'}</div>`}`;
    m.querySelectorAll('[data-jf]').forEach(b=>b.onclick=()=>{S.jf=b.dataset.jf;render();});
    m.querySelector('[data-newjob]').onclick=()=>{deeper();S.tab='quote';render();scrollTo(0,0);};
    m.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{deeper();S.job=b.dataset.job;render();scrollTo(0,0);});
  } else {
    const si=STAGES.findIndex(x=>x[0]===j.stage);const nx=STAGES[si+1];
    const act={new:'Start work',work:'Car is ready',ready:'Delivered to customer'}[j.stage];
    const rem=REMS.find(r=>r.job===j.id);
    m.innerHTML=`<div class="nh-head"><button class="nh-bk" data-back aria-label="Back">‹</button><b>Job #${j.no}</b><span class="tag" style="margin-left:auto;background:${stg(j.stage)[2]};color:#000">${stg(j.stage)[1]}</span></div>${testBar}
    <div class="jb-car"><div class="pic">${carPic(j.c)}</div><div><b>${esc(j.car)}</b><span>${j.suv?'SUV':'Sedan'}${j.km?' · '+kmf(j.km)+' km':''}${j.iv?' · next +'+kmf(j.iv.km):''}</span></div></div>
    <div class="jb-steps">${STAGES.map((x,i)=>`<div class="${i<=si?'on':''}" style="--sc:${x[2]}"><i></i><span>${x[1]}</span></div>`).join('')}</div>
    ${act?`<button class="btn okb" data-next>${act}</button>`:''}
    ${j.photo?`<img class="jb-photo" src="${j.photo}" alt="ملكية">`:`<label class="jb-ph"><input type="file" accept="image/*" capture="environment" hidden id="jbcam2"><svg><use href="#i-cam"/></svg><span>Add photo of ملكية</span></label>`}
    ${j.stage==='work'&&j.eta?`<div class="jb-eta">⏱ Ready ${etaText(j)}</div>`:''}
    ${(()=>{const T=jobTotals(j);return `<div class="jb-list">${(j.items||[]).map((it,i)=>`<button class="jb-r it${it.pend?' pend':''}" data-it="${i}"><div>${esc(it.d)}${it.sub||it.q!==1||it.u?`<small>${esc(it.sub||'')}${it.sub&&(it.q!==1||it.u)?' · ':''}${it.q!==1||it.u?(+it.q)+(it.u?' '+it.u:'')+' × '+f3(it.p):''}</small>`:''}</div><b>${it.pend?'Price?':f3(it.q*it.p)}</b></button>`).join('')}
      <button class="jb-r add" data-additem><div>＋ Add part or service</div></button>

/* ---------- Smart suggestions: what usually goes with a service, for this car ---------- */
const partsByCat=c=>(CAT.parts||[]).filter(p=>p[5].toLowerCase().includes(c));
const brandOf=j=>(j.c&&j.c.mk||'').toLowerCase();
const isV6=j=>/v6|3\.5|3\.0|4\.0/i.test((j.engName||''));
function suggestFor(j,svcName){
  const n=svcName.toLowerCase();const mk=brandOf(j);const out=[];
  const add=(p,q,why)=>{if(p&&!out.some(x=>x[0]===p[0]))out.push([p[0],p[1],p[2],q,p[4],why]);};
  const md=(j.c&&j.c.md||'').toLowerCase();
  const score=p=>{const d=p[1].toLowerCase();let sc=0;if(md&&d.includes(md))sc+=2;if(d.includes(mk)||(mk==='lexus'&&d.includes('toyota'))||(mk==='toyota'&&d.includes('lexus'))||(mk==='hyundai'&&d.includes('kia'))||(mk==='kia'&&d.includes('hyundai'))||(/chevrolet|gmc|cadillac/.test(mk)&&/\bgm\b|acdelco/.test(d)))sc+=1;if(sc===1&&md&&/camry|corolla|lexus|v6/.test(d)&&!d.includes(md))sc=0.5;return sc;};
  const best=list=>{const sc=list.map(p=>[score(p),p]).filter(x=>x[0]>0);if(!sc.length)return [];const m=Math.max(...sc.map(x=>x[0]));return sc.filter(x=>x[0]===m).map(x=>x[1]);};
  const brandMatch=p=>score(p)>0;
  if(/transmission fluid|gear|a\/t|cvt|differential/.test(n)){
    const fl=best(partsByCat('transmission fluid'));const fi=best(partsByCat('transmission filter'));const ga=best(partsByCat('gasket'));
    const L=j.suv?6:4;
    fl.forEach(p=>add(p,p[4]==='L'?L:(/4ltrs/i.test(p[1])?1:L),'fluid'));
    if(/filter/.test(n)){fi.forEach(p=>add(p,1,'filter'));ga.forEach(p=>add(p,1,'gasket'));}
    if(/differential|gear/.test(n))partsByCat('gear and differential').forEach(p=>add(p,2,'gear oil'));
  }
  if(/coolant|cooling/.test(n)){const c=best(partsByCat('coolant'));(c.length?c:partsByCat('cooling system')).forEach(p=>add(p,j.suv?2:1,'coolant'));}
  if(/brake fluid/.test(n))partsByCat('brake fluid').filter(p=>/DOT-4/.test(p[1])).forEach(p=>add(p,2,'DOT-4'));
  if(/brake/.test(n)&&!/fluid/.test(n))partsByCat('additives').filter(p=>/brake cleaner/i.test(p[1])).forEach(p=>add(p,1,'cleaner'));
  if(/throttle|intake/.test(n))partsByCat('additives').filter(p=>/intake/i.test(p[1])).forEach(p=>add(p,1,'cleaner'));
  if(/oil change/.test(n)){const codes=Object.keys(j.c&&j.c.fil||{}).map(k=>k.toUpperCase());let f=partsByCat('oil filter').filter(p=>codes.some(c=>p[0].toUpperCase().includes(c)||p[1].toUpperCase().includes(c)));if(!f.length)f=best(partsByCat('oil filter')).slice(0,2);f.forEach(p=>add(p,1,'oil filter'));}
  if(/spark/.test(n))partsByCat('additives').filter(p=>/injector|fuel system/i.test(p[1])).slice(0,1).forEach(p=>add(p,1,'optional'));
  return out;
}

  el.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{const k=b.dataset.pay;if(k){j.paid=Date.now();j.payBy=k;j.log.push([Date.now(),'Paid · '+k+' · '+S.user.name]);}else{j.paid=0;j.payBy='';}renderSheet();});
  $('#invwa').onclick=()=>{location.href='https://wa.me/'+(j.tel?waNum(j.tel):'')+'?text='+encodeURIComponent(invoiceText(j));};
  $('#invcp').onclick=()=>copyText(invoiceText(j));
  $('#invpr').onclick=()=>{
    const doc='<!doctype html><html><head><meta charset="utf-8"><style>@page{size:A4;margin:14mm}body{margin:0;font-family:Rubik,Arial,sans-serif;color:#000}'+INV_CSS+'</style></head><body>'+invoiceHtml(j,true)+'</body></html>';
    const P=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.FswPrint;
    if(!P){toast('Printing works in the installed app.');return;}
    P.printHtml({html:doc,widthMm:210,heightMm:297,name:'FSW invoice '+j.no}).catch(e=>toast('Could not print: '+(e&&e.message||e)));
  };
}

rgin-top:3mm;transform:rotate(-3deg)}.inv-ft{margin-top:5mm;text-align:center;font-size:2.9mm;color:#333;page-break-inside:avoid}";

function renderRems(m,hd){
  const list=REMS.slice().sort((a,b)=>a.next-b.next);
  m.innerHTML=hd+testBar+(list.length?`<div class="nh-list">${list.map((r,i)=>`<div class="nh-row"><b>${esc(r.car)}</b><span class="r">${fmtD(r.next).replace(/ \d{4}$/,'')}<small>${r.nextKm?kmf(r.nextKm)+' km':''}</small></span><span class="m">${esc(r.oil)}${r.tel?' · '+esc(r.tel):' · no phone'}</span>${r.tel?`<button class="btn ghost jb-wa" data-rw="${i}"><svg><use href="#i-send"/></svg>Remind on WhatsApp</button>`:''}</div>`).join('')}</div>`
    :`<div class="empty"><span style="font-size:2.2rem">🔔</span>No reminders yet. A reminder is saved when a job is delivered or a sticker is printed.</div>`);
  m.querySelectorAll('[data-rw]').forEach(b=>b.onclick=()=>{const r=list[+b.dataset.rw];location.href='https://wa.me/'+waNum(r.tel)+'?text='+encodeURIComponent('السلام عليكم،\nنذكركم بموعد تغيير زيت سيارتكم '+r.car+' بتاريخ '+fmtD(r.next)+(r.nextKm?' أو عند '+kmf(r.nextKm)+' كم':'')+'.\nورشة عالم الخدمات السريعة');});
  const h=m.querySelector('[data-home]');if(h)h.onclick=()=>{S.sec=null;render();scrollTo(0,0);};
}

function goBackStep(){
  if(!S.user)return false;
  if(S.sheet){closeSheet();return true;}
  if(S.tab==='home'&&S.sec==='jobs'&&S.job){S.job=null;render();scrollTo(0,0);return true;}
  if(S.tab==='home'&&S.sec){S.sec=null;render();scrollTo(0,0);return true;}
  const startTab=newHome()?'home':'quote';
  if(S.tab!=='quote'&&S.tab!==startTab){S.tab=startTab;render();scrollTo(0,0);return true;}
  if(S.tab==='quote'&&newHome()&&!S.make){S.tab='home';render();scrollTo(0,0);return true;}
  const c=car();
  if(S.year!=null&&c&&enginesFor(c).length>=2&&S.eng!=null){S.eng=null;resetQuote();}
  else if(S.year!=null){S.year=null;S.eng=null;resetQuote();}
  else if(S.model){S.model=null;}
  else if(S.make){S.make=null;}
  else return false;
  render();scrollTo(0,0);return true;
}
const CapApp=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
if(CapApp&&CapApp.addListener){try{CapApp.addListener('backButton',()=>{if(!goBackStep())CapApp.exitApp();});}catch(e){}}
else window.addEventListener('popstate',()=>{goBackStep();});

/* ---------- sync engine ---------- */
function putPic(col,key,url){
  const loc=store.get(col,{});
  if(col==='logos'){const lc=store.get('logos_cache',{});lc[key]=url;store.set('logos_cache',lc);}
  if(SYNC.db){SYNC.db.collection(col).doc(enc(key)).set({img:url,t:Date.now(),by:S.user?S.user.name:''}).catch(()=>{});MEM[col]=Object.assign({},MEM[col]||{},{[key]:url});if(loc[key]){delete loc[key];store.set(col,loc);}}
  else{loc[key]=url;try{localStorage.setItem('fsw_'+col,JSON.stringify(loc));}catch(e){toast('Storage full. Connect to the internet to share pictures.');}}
}
function delPic(col,key){
  if(col==='logos'){const lc=store.get('logos_cache',{});if(lc[key]){delete lc[key];store.set('logos_cache',lc);}}
  const loc=store.get(col,{});if(loc[key]){delete loc[key];store.set(col,loc);}
  if(MEM[col]&&MEM[col][key]){const m=Object.assign({},MEM[col]);delete m[key];MEM[col]=m;}
  if(SYNC.db)SYNC.db.collection(col).doc(enc(key)).delete().catch(()=>{});
}
let rTimer;
function liveRender(){clearTimeout(rTimer);rTimer=setTimeout(()=>{
  if(S.sheet)return;
  if(!S.user){if(!pinBuf)renderLogin();return;}
  if(S.tab==='set'&&addUser)return;
  rerender();},250);}
async function loadFB(){
  if(window.firebase&&window.firebase.firestore)return true;
  let code=null;try{code=localStorage.getItem('fsw_fbsdk_10141');}catch(e){}
  if(!code){try{code=await fetch(BASE+'app/fb.js?v=10141',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.text();});if(code.indexOf('firebase')<0)return false;try{localStorage.setItem('fsw_fbsdk_10141',code);}catch(e){}}catch(e){return false;}}
  const s=document.createElement('script');s.textContent=code;document.head.appendChild(s);
  return !!(window.firebase&&window.firebase.firestore);
}
async function startSync(){
  if(SYNC.state!=='off')return;SYNC.state='loading';
  if(!await loadFB()){SYNC.state='off';setTimeout(startSync,60e3);return;}
  try{
    const fb=window.firebase;fb.initializeApp(FB_CFG);
    const db=fb.firestore();try{await db.enablePersistence({synchronizeTabs:false});}catch(e){}
    await new Promise(res=>{const un=fb.auth().onAuthStateChanged(u=>{un();res(u);});});
    const signIn=()=>fb.auth().currentUser?Promise.resolve():fb.auth().signInAnonymously();
    try{await signIn();}catch(e){SYNC.state='waiting';const retry=()=>signIn().then(()=>{SYNC.state='on';attach(db);}).catch(()=>setTimeout(retry,60e3));window.addEventListener('online',retry,{once:true});setTimeout(retry,60e3);SYNC.db=db;return;}
    SYNC.db=db;SYNC.state='on';attach(db);
  }catch(e){SYNC.state='off';}
}
function attach(db){
  if(SYNC.attached)return;SYNC.attached=true;
  const picCol=col=>db.collection(col).onSnapshot(s=>{const m={};s.forEach(d=>{m[dec(d.id)]=d.data().img;});MEM[col]=m;if(col==='logos')store.set('logos_cache',m);
      if(!s.metadata.fromCache){const loc=store.get(col,{});let ch=false;Object.keys(loc).forEach(k=>{if(!(k in m)){db.collection(col).doc(enc(k)).set({img:loc[k],t:Date.now(),by:S.user?S.user.name:''}).then(()=>{const l2=store.get(col,{});delete l2[k];store.set(col,l2);}).catch(()=>{});}else{delete loc[k];ch=true;}});if(ch)store.set(col,loc);}
      liveRender();},()=>{});
  picCol('logos');picCol('carpics');
  /* keep a copy of the logos on this device so they show instantly at start */
  db.collection('users').onSnapshot(s=>{
    const list=[];s.forEach(d=>list.push(d.data()));
    if(!s.metadata.fromCache&&!SYNC.usersLoaded){SYNC.usersLoaded=true;
      const loc=store.get('users',[]);
      if(!list.length&&loc.length){loc.forEach(u=>db.collection('users').doc(u.id).set(u).catch(()=>{}));return;}
      loc.filter(u=>u.role!=='admin'&&!list.find(r=>r.id===u.id)).forEach(u=>{db.collection('users').doc(u.id).set(u).catch(()=>{});list.push(u);});
    }
    if(!list.length)return;
    list.sort((a,b)=>(a.role==='admin'?0:1)-(b.role==='admin'?0:1)||String(a.id).localeCompare(String(b.id)));
    MEM.users=list;store.set('users',list);
    if(S.user){const me=list.find(u=>u.id===S.user.id);if(!me){S.user=null;store.set('user',null);}else S.user=me;}
    liveRender();
  },()=>{});
  db.collection('hist').orderBy('t','desc').limit(200).onSnapshot(s=>{
    const h=[];s.forEach(d=>h.push(d.data()));MEM.hist=h;
    if(!s.metadata.fromCache){const loc=store.get('hist',[]);if(loc.length){loc.forEach(x=>{const id=x.id||('h'+x.t);db.collection('hist').doc(id).set(Object.assign({id},x)).catch(()=>{});});store.set('hist',[]);}}
    if(S.tab==='hist')liveRender();
  },()=>{});
}

/* ---------- look for app updates while the app stays open ---------- */
let lastUpd=0;
async function checkAppUpdate(){
  if(Date.now()-lastUpd<60e3)return;lastUpd=Date.now();
  try{
    const g=u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.text();});
    const rv=JSON.parse(await g(BASE+'app/version.json?t='+Date.now()));
    if(!(rv.v>(window.FSW_CODE_VERSION||0)))return;
    let saved=null;try{saved=JSON.parse(localStorage.getItem('fsw_code')||'null');}catch(e){}
    if(!(saved&&saved.v>=rv.v)){
      const [css,js]=await Promise.all([g(BASE+'app/app.css?v='+rv.v),g(BASE+'app/app.js?v='+rv.v)]);
      if(rv.name&&js.indexOf('window.FSW_APP_NAME="'+rv.name+'"')!==0){lastUpd=Date.now()-50e3;return;} /* server still sending the old file: try again shortly */
      try{localStorage.setItem('fsw_code',JSON.stringify({v:rv.v,name:rv.name,css,js}));}catch(e){return;}
    }
    window.dispatchEvent(new CustomEvent('fsw-update',{detail:rv}));
  }catch(e){}
}
/* if a saved copy is labelled newer than the code inside it, forget the label so it downloads again */
try{const sc=JSON.parse(localStorage.getItem('fsw_code')||'null');if(sc&&sc.name&&window.FSW_APP_NAME&&sc.name!==window.FSW_APP_NAME&&sc.v===window.FSW_CODE_VERSION){sc.v=0;localStorage.setItem('fsw_code',JSON.stringify(sc));window.FSW_CODE_VERSION=0;}}catch(e){}
setTimeout(checkAppUpdate,4000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkAppUpdate();syncData(false).then(r=>{if(r===true&&!S.sheet)rerender();});}});
setInterval(checkAppUpdate,10*60e3);

/* ---------- start ---------- */
if(window.FSW_HOOK)try{window.FSW_HOOK({S,render,rerender,store,toast,esc,f3,kmf,deeper,isAdmin,closeSheet});}catch(e){console.error(e);}
startSync();
if(newHome())S.tab='home';
(async()=>{
  await loadData();
  const saved=store.get('user',null);S.user=users().find(u=>u.id===saved)||null;
  render();
  const r=await syncData(false);
  if(r===true&&!S.sheet&&!(S.tab==='set'&&addUser))render();
  setInterval(async()=>{if(await syncData(false)===true&&!S.sheet)render();},30*60e3);
})();
})();
